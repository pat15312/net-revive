<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="NetRevive local network recovery" />
    <meta name="csrf-token" content="{{ csrf }}" />
    <title>
      NetRevive{% if title != 'NetRevive' %} · {{ title }}{% endif %}
    </title>
    <link rel="canonical" href="{{ canonical }}/" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="NetRevive dashboard"
        ><span class="brand-icon">↻</span>Net<span>Revive</span></a
      >
      <nav aria-label="Main">
        <a href="/admin">Admin <span aria-hidden="true">↗</span></a>
        <div class="theme-control">
          <button type="button" id="theme-trigger" aria-label="Appearance: Auto" aria-expanded="false" aria-controls="theme-options" title="Appearance: Auto"></button>
          <div id="theme-options" class="theme-options" role="group" aria-label="Appearance choices" hidden>
          <button type="button" data-theme-choice="dark" aria-label="Dark theme" aria-pressed="false" title="Dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg><span>Dark</span></button>
          <button type="button" data-theme-choice="light" aria-label="Light theme" aria-pressed="false" title="Light"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Light</span></button>
          <button type="button" data-theme-choice="system" aria-label="Auto theme" aria-pressed="true" title="Auto — follow device settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 5a7 7 0 0 1 0 14Z" fill="currentColor"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2"/></svg><span>Auto</span></button>
          </div>
        </div>
      </nav>
    </header>
    <main id="app">
      <p id="loading" role="status">Loading NetRevive…</p>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript
      ><p class="notice">
        Enable JavaScript to configure NetRevive and use its restart controls.
        All scripts are served locally.
      </p></noscript
    >
  </body>
</html>
