name: Test and publish NetRevive
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: net-revive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check app tests && ruff check app --select S
      - run: pytest -q
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node --check app/static/app.js && node --check app/static/theme.js
      - run: docker build --target test -t net-revive:test .

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require release commits on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Lowercase registry owner
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: metadata
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/net-revive
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/net-revive:candidate-${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
      - name: Scan both production platforms before promoting release tags
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/net-revive@${{ steps.image.outputs.digest }}
        run: |
          sh scripts/install-grype.sh "$RUNNER_TEMP/audit-bin"
          for platform in linux/amd64 linux/arm64; do
            "$RUNNER_TEMP/audit-bin/grype" "$IMAGE" --platform "$platform" --only-fixed --show-suppressed --fail-on high
          done
      - name: Promote scanned digest without rebuilding
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.name }}/net-revive@${{ steps.image.outputs.digest }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE"
